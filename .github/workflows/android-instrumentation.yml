name: Android recognizer instrumentation

on:
  push:
    paths:
      - 'app/src/androidTest/**'
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/android-instrumentation.yml'
  pull_request:
    paths:
      - 'app/src/androidTest/**'
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/android-instrumentation.yml'
  workflow_dispatch:

jobs:
  recognizer-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check Android SDK tools
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Enable KVM for emulator
        run: |
          sudo chmod 666 /dev/kvm
      - name: Run native OpenCV instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recognizer-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
