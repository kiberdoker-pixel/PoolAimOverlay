name: Build Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [aimx-ai]
  push:
    branches: [main, master, aimx-ai]
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate project files
        run: python3 tools/preflight.py
      - name: Unit tests and compile both APKs
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolAimOverlay-debug-APK
          retention-days: 14
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise OpenCV on synthetic Android frames
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recognition-test-results
          retention-days: 14
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
