name: Offline video harness tests

on:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/offline-video-tests.yml'
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/offline-video-tests.yml'
  workflow_dispatch:

jobs:
  offline-video-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video dependencies
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.10.0.84 pillow==11.1.0 numpy==2.1.3
      - name: Run offline evaluator tests
        run: python -m unittest discover -s tools -p 'test_evaluate_guides.py' -v
      - name: Run video extraction smoke test
        run: python tools/test_video_review.py
