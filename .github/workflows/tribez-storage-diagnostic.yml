name: Tribez original storage layout diagnostic
on:
  push:
    branches: [tribez-diagnostic-20261101]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - name: Download original XAPK
        run: |
          curl -fL --retry 2 --max-time 190 -o tribez-download.xapk \
            'https://d.apkpure.net/b/XAPK/com.gameinsight.tribez?version=latest'
          unzip -tqq tribez-download.xapk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Inspect application storage after launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/tribez_storage_diag.py
      - name: Upload read-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tribez-storage-locations
          path: tribez-storage-results/storage_report.json
          retention-days: 3
          if-no-files-found: warn
